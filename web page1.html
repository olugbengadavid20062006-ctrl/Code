<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>web page</title>
    </head>
    <body>
        <style>
            .subscribe {
                background-color: rgb(204, 0, 0);
                color: white;
                border: none;
                border-radius: 2px;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 16px;
                padding-right: 16px;
                cursor: pointer;
                font-family: Arial;
                font-weight: 400px;
                transition: opacity 0.15s;
                margin-right: 12px;
                transition: opacity 0.15s;
            }

                .subscribe:hover {
                    opacity: 0.8;
                }

                .subscribe:active {
                    opacity: 0.4;
                }

            .join {
                background-color: white;
                color: #065fd4;
                border-color:#065fd4;
                border-style: solid;
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 12px;
                padding-right: 12px;
                font-family: Arial;
                font-size: 14px;
                border-radius: 2px;
                cursor: pointer;
                line-height: normal;
                margin-right: 12px;
                transition: background-color 0.15s, color 0.15s;
            }

            .join:hover {
                background-color: #065fd4;
                color: white;
            }

            .join:active {
                opacity: 0.5;
            }

            .tweet {
                background-color: rgb(29, 155, 240);
                color: white;
                border-radius: 50px;
                padding-left: 16px;
                padding-right: 16px;
                padding-top: 7px;
                padding-bottom: 7px;
                border: none;
                cursor: pointer;
                font-size: 15px;
                font-weight: 700;
                transition:  box-shadow 0.15s;
            }

            .tweet:hover {
                box-shadow: 5px 5px 10px rgba( 0, 0, 0, 0.15);
            }

        </style>

        <button class="subscribe">
            SUBSCRIBE
        </button>
        
        <button class="join">
            JOIN
        </button>

        <button class="tweet">
            Tweet
        </button>

    </body>
</html>
