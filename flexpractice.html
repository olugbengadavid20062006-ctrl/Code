<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex practice</title>
    <style>
        body {
            margin: 0;
            margin-top: 10px;
        }

        .div {
            justify-content: space-evenly;
            background-color: blue;
            display: flex;
            flex-direction: row;
            height: 55px;
        }
        .middle {
            align-self: center;
            flex: 1;
            max-width: 700px;
            display: flex;
            flex-direction: row; 

        }

        .Search {
            border-top-left-radius: 17px;
            border-bottom-left-radius: 17px;
            height: 40px;
            width: 100%;
            border: 0;
            padding-left: 10px;
        }

        .sear-button {
            height: 42px;
            width: 65px;
            border: 1px;
            border-color: lightgray;
            border-style: solid;
            background-color: white;
            cursor: pointer;
            margin-right: 10px;
            border-top-right-radius: 19px;
            border-bottom-right-radius: 19px;
            position: relative;
        }

        .sear {
            height: 25px;
        }

        .left {
            width: 50px;
            margin-left: 8px;
            margin-right: 20px;
            color: white;
            align-self: center;
            margin-left: 20px;
            
            
        }

        .right {
            align-self: center;
            width: 150px;
        }

        .download {
            background-color: blue;
            color: white;
            border-color: white;
            border-style: solid;
            padding-top: 8px;
            padding-bottom: 8px;
            padding-left: 12px;
            padding-right: 12px;
            font-family: Arial;
            font-size: 14px;
            border-radius: 2px;
            cursor: pointer;
            line-height: normal;
            margin-right: 12px;
            margin-left: 30px;
            transition: background-color 0.15s, color 0.15s, border-color 0.15s, padding 0.2s;
        }

        .download:hover {
            background-color: white;
            color: blue;
            border-color: black;
            border-style: solid;
        }

        .download:active {
            padding: 6px 10px;
            
        }
    </style>
   
</head>
<body>

    <div class="div">
        <div class="left">
            HOME
        </div>

        <div class="middle">
            <input class="Search" placeholder="Search">

            <button class="sear-button">
                <img class="sear" src="youtube/New folder/search.svg">
            </button>
        </div>

        <div class="right">
            <button class="download">
                DOWNLOAD
            </button>
        </div>
    </div>
</body>
</html>
