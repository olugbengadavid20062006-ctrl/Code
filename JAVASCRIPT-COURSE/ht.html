<!DOCTYPE html>
<html lang="en">
    <head>
        <title>DOM PROJECTS</title>
    </head>
    <body>
        <P>
            Youtube Subscribe Button
        </P>

        <button 
            class="Subscribe-button" onclick="changeButtonText()"
        >
            Subscribe
        </button>


        <p>
            Amazon Price Calculator
        </p>

        <p>
            if price is greater than 40, free shipping.
        </p>

        <input type="number" class="nameInput" onkeydown="
          if (event.key === 'Enter' || event.keyCode === 32) {
            calculate();
          }
        ">

        <button class="calculate" onclick="calculate()">
            Calculate
        </button>

        <p class="result"></p>

    <SCRipt>
        function changeButtonText() {
            const buttonElement = document.querySelector('.Subscribe-button');
            if (buttonElement.innerText === 'Subscribe') {
                buttonElement.innerText = 'Subscribed';
            } else {
                buttonElement.innerText = 'Subscribe';
            }
        }

        function calculate() {
            const inputElement = document.querySelector('.nameInput');
            const inputValue = Number(inputElement.value);



            if (inputValue >= 40) {
                document.querySelector('.result').innerText = `$${inputValue}`;
            } else {
                document.querySelector('.result').innerText = `$${inputValue + 10}`;
            }
            
        }

    </SCRipt>
    </body>
</html>
