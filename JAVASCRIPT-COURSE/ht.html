<!DOCTYPE html>
<html lang="en">
    <head>
        <title>DOM PROJECTS</title>

        <style>

            body {
                font-family: Arial;
            }

            .Subscribe-button {
                background-color: black;
                color: white;
                padding: 10px 15px;
                border: none;
                border-radius: 50px;
                cursor: pointer;
                font-weight: bold;
                margin-bottom: 40px;
            }

            .subscribed {
                background-color: rgb(240, 240, 240);
                color: black;
            }

            .nameInput {
                font-size: 16px;
                padding: 10px 10px;
                margin-bottom: 10px;
                opacity: 0.75;
            }

            .calculate {
                background-color: green;
                color: white;
                padding: 12px 15px;
                border: none;
                cursor: pointer;
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <P>
            Youtube Subscribe Button
        </P>

        <button 
            class="Subscribe-button" onclick="changeButtonText()"
        >
            Subscribe
        </button>


        <p>
            Amazon Price Calculator
        </p>

        <p>
            if price is greater than 40, free shipping.
        </p>

        <input class="nameInput" 
        placeholder="Cost of order"
        onkeydown="
          if (event.key === 'Enter' || event.keyCode === 32) {
            calculate();
          }
        ">

        <button class="calculate" onclick="calculate()">
            Calculate
        </button>

        <p class="result"></p>

    <SCRipt>
        function changeButtonText() {
            const buttonElement = document.querySelector('.Subscribe-button');
            if (buttonElement.innerText === 'Subscribe') {
                buttonElement.innerText = 'Subscribed';
                buttonElement.classList.add('subscribed');  
            } else {
                buttonElement.innerText = 'Subscribe';
                buttonElement.classList.remove('subscribed');
            }
        }

        function calculate() {
            const inputElement = document.querySelector('.nameInput');
            const inputValue = Number(inputElement.value);



            if (inputValue >= 40) {
                document.querySelector('.result').innerText = `$${inputValue}`;
            } else {
                document.querySelector('.result').innerText = `$${inputValue + 10}`;
            }
            // Clear the input field after calculation
            inputElement.value = '';
        }

    </SCRipt>
    </body>
</html>
