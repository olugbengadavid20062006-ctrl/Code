
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #a5b4fc;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #c7d2fe;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .choice-btn {
            flex: 1;
            max-width: 150px;
            height: 140px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .choice-btn span {
            display: block;
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .rock {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
        }

        .paper {
            background: linear-gradient(145deg, #059669, #047857);
        }

        .scissors {
            background: linear-gradient(145deg, #e11d48, #be123c);
        }

        .choice-btn:hover {
            transform: translateY(-8px) scale(1.04);
            filter: brightness(1.2);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }

        .choice-btn:active {
            transform: scale(0.95);
        }

        .result-box {
            background: rgba(15, 23, 42, 0.65);
            border-radius: 18px;
            padding: 25px 15px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .result {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: #facc15;
        }

        .moves {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .move {
            min-width: 110px;
        }

        .move span {
            display: block;
            font-size: 2rem;
            margin-top: 8px;
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .score-card {
            background: rgba(255,255,255,0.08);
            padding: 15px 5px;
            border-radius: 15px;
        }

        .score-card h3 {
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .score-card p {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .wins {
            color: #4ade80;
        }

        .losses {
            color: #fb7185;
        }

        .ties {
            color: #facc15;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid #94a3b8;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .reset-btn:hover {
            background: #e11d48;
            border-color: #e11d48;
        }

        .footer {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-top: 25px;
        }

        @media (max-width: 500px) {
            .game-container {
                padding: 22px 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .choices {
                gap: 8px;
            }

            .choice-btn {
                height: 115px;
                font-size: 0.8rem;
            }

            .choice-btn span {
                font-size: 2rem;
            }

            .result {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>

    <div class="game-container">

        <h1>ROCK PAPER SCISSORS</h1>
        <p class="subtitle">Challenge the computer. Can you beat it?</p>

        <h2 class="section-title">CHOOSE YOUR MOVE</h2>

        <div class="choices">

            <button class="choice-btn rock" onclick="playGame('rock')">
                <span>✊</span>
                ROCK
            </button>

            <button class="choice-btn paper" onclick="playGame('paper')">
                <span>✋</span>
                PAPER
            </button>

            <button class="choice-btn scissors" onclick="playGame('scissors')">
                <span>✌️</span>
                SCISSORS
            </button>

        </div>

        <div class="result-box">

            <div class="result" id="result">
                MAKE YOUR MOVE!
            </div>

            <div class="moves">

                <div class="move">
                    YOU
                    <span id="playerMove">❔</span>
                </div>

                <div class="move">
                    COMPUTER
                    <span id="computerMove">❔</span>
                </div>

            </div>

        </div>

        <h2 class="section-title">YOUR SCOREBOARD</h2>

        <div class="scoreboard">

            <div class="score-card">
                <h3>WINS</h3>
                <p class="wins" id="wins">0</p>
            </div>

            <div class="score-card">
                <h3>TIES</h3>
                <p class="ties" id="ties">0</p>
            </div>

            <div class="score-card">
                <h3>LOSSES</h3>
                <p class="losses" id="losses">0</p>
            </div>

        </div>

        <button class="reset-btn" onclick="resetScore()">
            ↻ RESET SCORE
        </button>

        <p class="footer">MADE WITH JAVASCRIPT ❤️</p>

    </div>


    <script>

        // Score object
        let score = {
            wins: 0,
            ties: 0,
            losses: 0
        };

        // Available moves
        const moves = {
            rock: "✊",
            paper: "✋",
            scissors: "✌️"
        };

        // Main game function
        function playGame(playerChoice) {

            // Generate computer choice
            let randomNumber = Math.random();
            let computerChoice;

            if (randomNumber < 1 / 3) {
                computerChoice = "rock";
            } else if (randomNumber < 2 / 3) {
                computerChoice = "paper";
            } else {
                computerChoice = "scissors";
            }

            let result;

            // Determine winner
            if (playerChoice === computerChoice) {

                result = "IT'S A TIE!";
                score.ties++;

            } else if (
                (playerChoice === "rock" && computerChoice === "scissors") ||
                (playerChoice === "paper" && computerChoice === "rock") ||
                (playerChoice === "scissors" && computerChoice === "paper")
            ) {

                result = "YOU WON! 🎉";
                score.wins++;

            } else {

                result = "YOU LOST! 😢";
                score.losses++;

            }

            // Display result
            document.getElementById("result").textContent = result;

            // Display selected moves
            document.getElementById("playerMove").textContent =
                moves[playerChoice];

            document.getElementById("computerMove").textContent =
                moves[computerChoice];

            // Update scoreboard
            updateScore();

        }


        // Update score on webpage
        function updateScore() {

            document.getElementById("wins").textContent = score.wins;

            document.getElementById("ties").textContent = score.ties;

            document.getElementById("losses").textContent = score.losses;

        }


        // Reset game score
        function resetScore() {

            score.wins = 0;
            score.ties = 0;
            score.losses = 0;

            updateScore();

            document.getElementById("result").textContent = "MAKE YOUR MOVE!";

            document.getElementById("playerMove").textContent = "❔";

            document.getElementById("computerMove").textContent = "❔";

        }

    </script>

</body>
</html>
