<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/style.css" rel="stylesheet">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

            :root {
                --bg-1: #0f0c29;
                --bg-2: #302b63;
                --bg-3: #24243e;
                --text: #f5f5ff;
                --rock: #ff6b6b;
                --paper: #4dabf7;
                --scissors: #ffd43b;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.5rem;
                padding: 2rem 1rem;
                font-family: 'Poppins', system-ui, sans-serif;
                color: var(--text);
                background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
                background-size: 200% 200%;
                animation: bgShift 12s ease infinite;
                text-align: center;
            }

            @keyframes bgShift {
                0%   { background-position: 0% 50%; }
                50%  { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }

            /* Title */
            p {
                font-size: clamp(1.6rem, 5vw, 3rem);
                font-weight: 800;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                margin-bottom: 1rem;
                background: linear-gradient(90deg, var(--rock), var(--scissors), var(--paper));
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
            }

            /* Buttons */
            button {
                font-family: inherit;
                font-size: 1.1rem;
                font-weight: 600;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                min-width: 200px;
                padding: 0.9rem 2rem;
                border: 2px solid transparent;
                border-radius: 999px;
                color: #111;
                cursor: pointer;
                transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            }

            button:hover {
                transform: translateY(-4px) scale(1.05);
                filter: brightness(1.1);
            }

            button:active {
                transform: translateY(0) scale(0.97);
            }

            button:focus-visible {
                outline: 3px solid #fff;
                outline-offset: 4px;
            }

            .rock {
                background: var(--rock);
                box-shadow: 0 8px 24px rgba(255, 107, 107, 0.4);
            }
            .rock:hover {
                box-shadow: 0 12px 32px rgba(255, 107, 107, 0.7);
            }

            .paper {
                background: var(--paper);
                box-shadow: 0 8px 24px rgba(77, 171, 247, 0.4);
            }
            .paper:hover {
                box-shadow: 0 12px 32px rgba(77, 171, 247, 0.7);
            }

            .scissors {
                background: var(--scissors);
                box-shadow: 0 8px 24px rgba(255, 212, 59, 0.4);
            }
            .scissors:hover {
                box-shadow: 0 12px 32px rgba(255, 212, 59, 0.7);
            }

            /* Side-by-side buttons on wider screens */
            @media (min-width: 700px) {
                body {
                    flex-direction: row;
                    flex-wrap: wrap;
                    align-content: center;
                    justify-content: center;
                }
                p {
                    flex-basis: 100%;
                }
            }
        </style>
    </head>
    <body>

    <p>
        ROCK PAPER SCISSORS GAME
    </p>

    <button title="wagwan" class="rock" onclick="template('rock')">
        rock
    </button>

    <button class="paper" onclick="template('paper')">
        paper
    </button>

    <button class="scissors" onclick="template('scissors')">
        scissors
    </button>

    
    
    <script>

        let score= {
            wins : 0,
            tie: 0,
            losses:0
        }

        function template(playerChoice) {
            let computerPick = Math.random();
            let computerChoice;

            if (computerPick < 1/3) {
                 computerChoice = "rock";
            } else if (computerPick > 1/3 && computerPick < 2/3) {
                 computerChoice = "scissors";
            } else {
                 computerChoice = "paper";
            }
            let result;
            
            if (computerChoice === playerChoice) {
                result = "it's a tie";
                score.tie += 1;
            } else if (
                (playerChoice === "rock" && computerChoice === "scissors") ||
                (playerChoice === "paper" && computerChoice === "rock") ||
                (playerChoice === "scissors" && computerChoice === "paper")
            ) {
                score.wins += 1;
                result = "you won!!"
            } else {
                score.losses += 1;
                result = "You lost"
            }

            console.log(`Computer chose ${computerChoice}`);
            console.log(result);
            console.log(`Your score = ${score}`);

            alert(
                `Computer chose ${computerChoice}, ${result}, Wins = ${score.wins}, losses = ${score.losses}, ties = ${score.tie}.`
            )
            return result;
            
        }

       
        
    </script>
    

    </body>
</html>
