<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
    <p>
        rock paper scissors game
    </p>
    <button class="rock" onclick="template('rock')">
        Rock
    </button>

    <button class="paper" onclick="template('paper')">
        Paper
    </button>

    <button class="scissors" onclick="template('scissors')">
        Scissors
    </button>

    <button class="reset" onclick="window.location.reload()">
        Reset
    </button>

    <p>
        <span class="wins">Wins: 0</span>
        <span class="losses">Losses: 0</span>
        <span class="ties">Ties: 0</span>
    </p>

    <script>

        let score = {
            wins: 0,
            Losses: 0,
            Ties: 0
        }
        let computerChoice = Math.random();
        let computerPick = '';
        let result = '';
        if (computerChoice < 1/3) {
                computerPick = "rock";
            } else if (computerChoice > 1/3 && computerChoice < 2/3) {
                computerPick = "scissors";
            } else {
                computerPick = "paper";
            }
            
        function template(playerChoice) {
            let computerChoice = Math.random();
            let computerPick;
            let result;
                if (computerChoice < 1/3) {
                    computerPick = "rock";
                } else if (computerChoice > 1/3 && computerChoice < 2/3) {
                    computerPick = "scissors";
                } else {
                    computerPick = "paper";
                }


                if (playerChoice === computerPick) {
                    result = "it's a tie";
                } else if (
                    (playerChoice === "rock" && computerPick === "scissors") ||
                    (playerChoice === "paper" && computerPick === "rock") ||
                    (playerChoice === "scissors" && computerPick === "paper")
                ) {
                    result = "you won!!"
                } else {
                    result = "You Lose!!"
                }
               
                console.log("computer choice is: " + computerPick + " and your choice is: " + playerChoice + " so the result is: " + result);

        }
    </script>
    </body>
