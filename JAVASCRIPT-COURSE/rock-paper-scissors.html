<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="rock-paper-scissors.css" rel="stylesheet">
    </head>
    <body>
    <p class="Title">
        Rock Paper Scissors
    </p>
    <button class="rock" onclick="template('rock')">
        <img src="images/rock-emoji.png" class="rockImage">
    </button>

    <button class="paper" onclick="template('paper')">
        <img src="images/paper-emoji.png" class="rockImage">
    </button>

    <button class="scissors" onclick="template('scissors')">
        <img src="images/scissors-emoji.png" class="rockImage">
    </button>

    <p class="resultMessage"></p>
    <p class="moves">
    </p>
    <p class="scores"></p>

    <button class="reset" onclick=" score.win = 0; score.lose = 0; score.tie = 0; document.querySelector('.scores').innerText = `Wins: ${score.win}, Losses: ${score.lose}, Ties: ${score.tie}`;">
        Reset Score
    </button>
    
    

    <script src="rock-paper-scissors.js"></script>
    </script>
    </body>
</html>
