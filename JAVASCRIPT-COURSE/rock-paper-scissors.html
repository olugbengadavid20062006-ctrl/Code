<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
    <p>
        rock paper scissors game
    </p>
    <button class="rock" onclick="template('rock')">
        Rock
    </button>

    <button class="paper" onclick="template('paper')">
        Paper
    </button>

    <button class="scissors" onclick="template('scissors')">
        Scissors
    </button>

    <button class="reset" onclick="window.location.reload()">
        Reset
    </button>
    <p class="resultMessage"></p>
    <p class="scores"></p>
    

    <script>
        let score = {
            win: 0,
            lose: 0,
            tie: 0
        };
        document.querySelector('.scores').innerText =
    `Wins: ${score.win}, Losses: ${score.lose}, Ties: ${score.tie}`;




        let computerChoice = Math.random();
        let computerPick = '';
        let result = '';
        if (computerChoice < 1/3) {
                computerPick = "rock";
            } else if (computerChoice > 1/3 && computerChoice < 2/3) {
                computerPick = "scissors";
            } else {
                computerPick = "paper";
            }
            
        function template(playerChoice) {
            let computerChoice = Math.random();
            let computerPick;
            let result;

                if (computerChoice < 1/3) {
                    computerPick = "rock";
                } else if (computerChoice > 1/3 && computerChoice < 2/3) {
                    computerPick = "scissors";
                } else {
                    computerPick = "paper";
                }


                if (playerChoice === computerPick) {
                    document.querySelector('.resultMessage').innerText = `It's a tie!`;
                    score.tie++;
                } else if (
                    (playerChoice === "rock" && computerPick === "scissors") ||
                    (playerChoice === "paper" && computerPick === "rock") ||
                    (playerChoice === "scissors" && computerPick === "paper")
                ) {
                    console.log("You win!");
                    document.querySelector('.resultMessage').innerText = `You win!`;
                    score.win++;
                } else {
                    console.log("You lose!");
                    document.querySelector('.resultMessage').innerText = `You lose!`;
                    score.lose++;
                }
               
                document.querySelector('.scores').innerText =
                    `Wins: ${score.win}, Losses: ${score.lose}, Ties: ${score.tie}`;

        }
    </script>
    </body>
</html>
