<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS POSITION</title>
</head>
<body style="
    height: 3000px;
    padding-top: 50px;
    padding-left: 80px;
    margin: 0;
">
    <div style="
        background-color: black;
        color: white;
        position: fixed;
        top: 10px;
        ">
        HEADER
    </div>
    <div style="
    background-color: lightgreen;
    color: white;
    position: fixed;
    left: 0px;
    bottom: 0;
    top: 50px;
    width: 80px;
    ">
        SIDEBAR
    </div>

    <div style="
        background-color: lightblue;
        height: 200px;
        width: 200px;
        ">
        DIV 1
    </div>
    <div style="
        background-color: lightpink;
        height: 200px;
        width: 200px;">
        DIV 2
    </div>
</body>
</html>
